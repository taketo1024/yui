[package]
name = "ykh"
description = "CLI for Khovanov Homology Computation"
version = "0.4.0"

authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace  = true

[features]
i128 = []
bigint = []

[dependencies]
clap = { version = "4.6.1", features = ["derive", "cargo"] }
csv = "1.3.1"
derive_more = { version = "2.1.1", features = ["display", "debug"] }
log = "0.4.29"
num-bigint = "0.4.6"
num-traits = "0.2.19"
regex = "1.12.3"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
cfg-if = "1.0.4"
itertools = "0.14.0"
yui-core  =    { version = "0.4.0", path = "../lib-core", features = ["tex"] }
yui-link =     { version = "0.4.0", path = "../lib-link" }
yui-matrix =   { version = "0.4.0", path = "../lib-matrix" }
yui-homology = { version = "0.4.0", path = "../lib-homology", features = ["tex"] }
yui-kh =       { version = "0.4.0", path = "../lib-kh" }
