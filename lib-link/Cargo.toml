[package]
name = "yui-link"
description = "Knots & Links Library for YUI"
version = "0.5.0"

authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace  = true

[features]
default = []
test-utils = []
big-link = []

[dependencies]
auto-impl-ops = "0.2.1"
