[package]
name = "sakuma-si"
version = "0.1.0"
edition = "2021"

# standalone — not a member of the yui workspace (experiments/ is git-ignored).
[workspace]

[dependencies]
yui-core = { path = "../../../lib-core" }
yui-link = { path = "../../../lib-link" }
yui-kh = { path = "../../../lib-kh", features = ["big-link"] }
num-traits = "0.2"
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
debug = true
