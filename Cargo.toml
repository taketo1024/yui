[workspace]
members = [ 
    "bin-ykh",
    "lib-core",
    "lib-matrix",
    "lib-homology",
    "lib-link",
    "lib-kh"
]
resolver = "3"

[workspace.package]
authors = ["Taketo Sano <taketo1024@gmail.com>"]
license = "MIT"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/taketo1024/yui"

[workspace.dependencies]
yui-core     = { version = "0.4.0", path = "lib-core" }
yui-link     = { version = "0.4.0", path = "lib-link" }
yui-matrix   = { version = "0.4.0", path = "lib-matrix" }
yui-homology = { version = "0.4.0", path = "lib-homology" }
yui-kh       = { version = "0.4.0", path = "lib-kh" }

[profile.release]
overflow-checks = true
# debug = true