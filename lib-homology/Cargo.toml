[package]
name = "yui-homology"
description = "Homology Library for YUI"
version = "0.5.0"

authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace  = true

[features]
default = ["multithread"]
multithread = ["rayon"]
test-utils = []

[dependencies]
ahash = "0.8.12"
cartesian = "0.3.0"
cfg-if = "1.0.4"
delegate = "0.13.5"
derive_more = { version = "2.1.1", features = ["display", "debug", "add", "not"] }
grouping_by = "0.2.2"
indexmap = "2.14.0"
itertools = "0.14.0"
log = "0.4.29"
num-traits = "0.2.19"
rayon = { version = "1.12.0", optional = true }
sprs = "0.11.4"
yui-core.workspace = true
yui-matrix.workspace = true

[dev-dependencies]
maplit = "1.0.2"
