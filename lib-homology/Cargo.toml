[package]
name = "yui-homology"
description = "Homology Library for YUI"
version = "0.5.0"

authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace  = true

[features]
default = ["multithread"]
multithread = ["rayon"]
serde = ["dep:serde", "dep:serde_json", "ahash/serde"]
tex = ["yui-core/tex"]

[dependencies]
ahash = "0.8.12"
cartesian = "0.3.0"
cfg-if = "1.0.4"
delegate = "0.13.5"
derive_more = { version = "2.1.1", features = ["display", "debug", "add"] }
grouping_by = "0.2.2"
indexmap = { version = "2.14.0", features = ["serde"] }
itertools = "0.14.0"
log = "0.4.29"
num-traits = "0.2.19"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.228", optional = true }
serde_json = { version = "1.0.149", optional = true }
sprs = "0.11.4"
yui-core.workspace = true
yui-matrix.workspace = true
