[package]
name = "yui-kh"
description = "Khovanov Homology Library for YUI"
version = "0.5.0"

authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace  = true

# benchmarks live in the [[bench]] target below, not the lib's unit tests.
# without this, `cargo bench` compiles the lib's tests in release, where the
# debug-only `check_d_all` helper is absent — a spurious compile error.
[lib]
bench = false

[features]
default = []
big-link = ["yui-link/big-link"]
tex = ["yui-core/tex"]

[dependencies]
auto-impl-ops = "0.2.1"
cartesian = "0.3.0"
delegate = "0.13.5"
derive_more = { version = "2.1.1", features = ["display", "debug"] }
grouping_by = "0.2.2"
indexmap = { version = "2.14.0", features = ["serde"] }
log = "0.4.29"
maplit = "1.0.2"
num-bigint = "0.4.6"
num-traits = "0.2.19"
regex = "1.12.3"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
cfg-if = "1.0.4"
itertools = "0.14.0"
rustc-hash = "2.1.1"
rayon = "1.12.0"
dashmap = "6.1.0"
smallvec = "1.13"
yui-core.workspace = true
yui-link.workspace = true
yui-matrix.workspace = true
yui-homology.workspace = true

[dev-dependencies]
yui-link = { workspace = true, features = ["test-utils"] }
yui-homology = { workspace = true, features = ["test-utils"] }
criterion = "0.5"
env_logger = "0.11"

[[bench]]
name = "kh"
harness = false

[[bench]]
name = "khi"
harness = false
