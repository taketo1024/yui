[package]
name = "yui-core"
description = "Core Library for YUI"
version = "0.5.0"

authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace  = true

[features]
serde = ["dep:serde", "dep:serde_json", "dep:serde_repr", "dep:serde_with"]
tex = []

[dependencies]
ahash = { version = "0.8.12", features = ["serde"] }
auto-impl-ops = "0.2.1"
cfg-if = "1.0.4"
delegate = "0.13.5"
derive_more = { version = "2.1.1", features = ["display", "debug"] }
dinglebit_combinatorics = "1.1.0"
directories = "6.0.0"
indexmap = "2.14.0"
is-even = "1.0.0"
itertools = "0.14.0"
log = "0.4.29"
maplit = "1.0.2"
num-bigint = "0.4.6"
num-integer = { version = "0.1.46", features = ["i128"] }
num-traits = "0.2.19"
petgraph = "0.8.3"
prettytable = "0.10.0"
regex = "1.12.3"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
serde_repr = { version = "0.1.20", optional = true }
serde_with = {version = "3.20.0", optional = true } 
